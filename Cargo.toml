[package]
name = "cf-ddns"
version = "0.1.0"
edition = "2024"
description = "A small Cloudflare dynamic DNS client"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "env", "error-context", "help", "std", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
